[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-vla-maze"
version = "0.3.0"
description = "Language-conditioned visual pushing: imitation, planning and dynamic obstacles"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "Pillow>=10", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
